=== docker-compose.yml ===
version: '3.8'

services:
  java-crm:
    build:
      context: .
      dockerfile: Dockerfile
    image: java-crm:latest
    container_name: java-crm-app
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport
      - DB_HOST=${DB_HOST:-mysql-host}
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-U07k1T}
      - DB_USERNAME=${DB_USERNAME:-U07k1T}
      - DB_PASSWORD=${DB_PASSWORD:-53689053296}
      - VIEW_PATH=/View/
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  logs:
  config:
