apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-crm
  namespace: java-crm
  labels:
    app: java-crm
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: java-crm
  template:
    metadata:
      labels:
        app: java-crm
        version: v1
    spec:
      containers:
      - name: java-crm
        image: {{IMAGE_URI}}
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0"
        - name: TZ
          value: "UTC"
        - name: DB_HOST
          value: "{{DB_HOST}}"
        - name: DB_NAME
          value: "{{DB_NAME}}"
        - name: DB_USER
          value: "{{DB_USER}}"
        - name: DB_PASSWORD
          value: "{{DB_PASSWORD}}"
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      restartPolicy: Always